
apiVersion: v1                      # API core/v1.
kind: Secret                        # Tipo de recurso: secreto.
metadata:
  name: db-secret                   # Nombre referenciado por "secretKeyRef" (MongoDB) y "secretRef" (backend).
  namespace: practica-s11           # Namespace aislado del proyecto.
  labels:
    app: mongo
    tier: database
type: Opaque                        # Tipo genérico definido por el usuario (clave/valor arbitrario).
data:                               # "data" exige valores YA codificados en Base64.
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=                       # Base64 de: admin
  MONGO_INITDB_ROOT_PASSWORD: UzExX01vbmdvX1NlZ3VyYV8yMDI2   # Base64 de: S11_Mongo_Segura_2026
