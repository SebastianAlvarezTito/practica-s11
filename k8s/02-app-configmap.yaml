
apiVersion: v1                      # API core/v1.
kind: ConfigMap                     # Tipo de recurso: mapa de configuración.
metadata:
  name: app-config                  # Nombre que referenciará "configMapRef" en 05-backend-stack.yaml.
  namespace: practica-s11           # Namespace aislado del proyecto.
  labels:
    app: backend-webflux            # Pertenece a la capa de procesamiento.
    tier: backend
data:
  DB_HOST: "mongo-service"          # Nombre DNS del Service ClusterIP de MongoDB (CoreDNS lo resuelve dentro del namespace).
  DB_PORT: "27017"                  # Puerto de escucha de MongoDB. Va entre comillas: los valores de un ConfigMap son strings.
  DB_NAME: "inventario_db"          # Nombre de la base de datos de producción que usará la aplicación.
  APP_PORT: "8080"                  # Puerto donde escucha Spring WebFlux (lo lee application.yml: server.port).
